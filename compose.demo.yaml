# Run with a separate project and private environment file. Never combine with compose.yaml.
services:
  db:
    image: postgres:18.6-bookworm
    command:
      - postgres
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_min_error_statement=panic
    environment:
      POSTGRES_DB: pi_demo
      POSTGRES_USER: demo_operator
      POSTGRES_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?Set a unique demo operator password}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:?Set a unique demo application password}
    volumes:
      - demo-data:/var/lib/postgresql
      - ./scripts/init-demo-db.sh:/docker-entrypoint-initdb.d/010-demo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_operator -d pi_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      APPLICATION_MODE: demo
      DATABASE_URL: postgresql://pi_demo:${DEMO_DB_PASSWORD:?Set a unique demo application password}@db:5432/pi_demo
      DEMO_DATABASE_URL: postgresql://pi_demo:${DEMO_DB_PASSWORD:?Set a unique demo application password}@db:5432/pi_demo
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set a unique demo sign-in password}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a unique demo authentication secret}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:?Set a unique demo setup secret}
      BETTER_AUTH_URL: http://localhost:${DEMO_APP_PORT:-3100}
      ALLOW_INSECURE_HTTP: "true"
    ports:
      - "127.0.0.1:${DEMO_APP_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  demo-data:
