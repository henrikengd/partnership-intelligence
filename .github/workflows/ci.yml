name: Application checks
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: pi_test
          POSTGRES_PASSWORD: fictional_ci_only
          POSTGRES_DB: pi_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pi_test -d pi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pi_test:fictional_ci_only@localhost:5432/pi_ci
      TEST_DATABASE_URL: postgresql://pi_test:fictional_ci_only@localhost:5432/pi_ci
      BETTER_AUTH_SECRET: fictional-ci-authentication-secret-32-characters
      BOOTSTRAP_SECRET: fictional-ci-bootstrap-secret-32-characters
      BETTER_AUTH_URL: http://localhost:3100
      ALLOW_INSECURE_HTTP: "true"
      E2E_PORT: "3100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:provision-demo
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
