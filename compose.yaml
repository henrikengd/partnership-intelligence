services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: partnership
      POSTGRES_USER: partnership
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    volumes:
      - partnership-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partnership -d partnership"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://partnership:${POSTGRES_PASSWORD:?Set a private database password}@db:5432/partnership
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a unique authentication secret}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:?Set a unique setup secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the external application URL}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  partnership-data:
